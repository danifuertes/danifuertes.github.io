# Research lines shown as cards.

- title: Multi-agent route planning
  description: >-
    Planning routes for fleets of cooperating agents, such as UAVs, vehicles or aircraft, on vehicle routing
    and orienteering problems.

- title: Autonomous navigation
  description: >-
    End-to-end models that solve route planning and path finding jointly, so agents reach their goals
    while avoiding obstacles.

- title: Deep learning
  description: >-
    Deep reinforcement learning and Transformer networks for decision making on graphs, and deep learning
    models for perception and computer vision.
