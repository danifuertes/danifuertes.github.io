# Research lines shown as cards. `papers` lists publication ids from publications.yml.

- title: Multi-agent route planning
  description: >-
    Deep reinforcement learning and Transformer networks that plan routes for fleets of cooperating agents
    (UAVs, vehicles, aircraft) on vehicle routing and orienteering problems.
  papers: [top-former, mc-uav, maenvs4vrp, sar-surveillance, phd-thesis]

- title: Autonomous navigation
  description: >-
    End-to-end models that solve route planning and path finding jointly, so agents reach their goals
    while avoiding obstacles.
  papers: [naviformer]

- title: Computer vision
  description: >-
    Deep learning for detection under hard conditions: nighttime driving, omnidirectional cameras and
    logo recognition with limited data.
  papers: [nighttime-vehicles, gsac-dnn, logomix]
