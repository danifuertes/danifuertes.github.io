# Biography for the About section (Markdown).
bio: |
  Daniel Fuertes received the Bachelor's degree in Telecommunication Engineering in 2019 and the Ph.D. degree
  in Telecommunication Engineering in 2025, both from the Universidad Politécnica de Madrid (UPM), Madrid, Spain.
  He has been a member of the [Grupo de Tratamiento de Imágenes (GTI)](http://gti.ssr.upm.es) at UPM since 2020,
  taking part in several research projects with industry partners such as
  [Airbus Defence and Space](https://www.airbus.com), and completed an international research internship
  at the [Idiap Research Institute](https://www.idiap.ch). In 2025, he joined the Department of Signals, Systems
  and Communications as an Assistant Professor of Signal Theory and Communications.

  His research focuses on deep reinforcement learning and Transformer networks for multi-agent route planning,
  vehicle routing problems and autonomous navigation, as well as deep learning for computer vision.
